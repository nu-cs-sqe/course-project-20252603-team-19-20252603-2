# English (en) message bundle.
#
# Loaded via ResourceBundle.getBundle("message", Locale.ENGLISH) — see
# docs/STANDARDS.md section 7 for the i18n convention. Keys are dot-separated
# namespaces (<domain>.<situation>); never inline user-facing strings in Java.

card.nullType = cardType must not be null
deck.emptyType = The draw pile is empty
deck.peekTop.tooManyRequested = You requested more cards than the deck has
deck.peekTop.negativeN = The number of cards requested must be non-negative
deck.insertAt.indexTooLarge = You indexed a card that does not exist
deck.insertAt.negativeIndex = You indexed a card that does not exist
turnTracker.numPlayers.tooSmall = There must be at least two players
turnTracker.currentDirection.invalid = The direction must be 1 or -1.
player.addCardToHand.nullCard = card must not be null
player.getCardAt.invalidIndex = card index is out of range
player.removeCardFromHand.invalidIndex = card index is out of range
player.markDead.alreadyDead = player is already dead
gameEngine.numPlayers.outOfRange = number of players must be between 2 and 5
gameEngine.getPlayer.invalidId = player id is out of range